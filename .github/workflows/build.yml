name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run lint
        run: ruff check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run build script
        shell: cmd
        run: |
          call scripts\build.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-patcher-windows-${{ github.ref_name || 'manual' }}
          path: |
            Releases/binary_patcher.exe
            Releases/apply_patch.exe
            Releases/rollback_patch.exe
            Releases/binary_patcher_toolkit.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/binary-patcher-windows-${{ github.ref_name }}/binary_patcher.exe
            artifacts/binary-patcher-windows-${{ github.ref_name }}/apply_patch.exe
            artifacts/binary-patcher-windows-${{ github.ref_name }}/rollback_patch.exe
            artifacts/binary-patcher-windows-${{ github.ref_name }}/binary_patcher_toolkit.zip
          generate_release_notes: true
