[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-patcher"
version = "1.0.0"
description = "A small tool for creating and applying binary patches with HDiffPatch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "Project Maintainer" }
]

[tool.setuptools]
py-modules = ["binary_patcher", "apply_patch", "rollback_patch", "hdiffpatch_utils"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/legacy/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]